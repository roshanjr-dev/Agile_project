name: Student Management System CI

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run Student Management System
        run: node app.js

      - name: Check project files
        run: |
          test -f app.js
          test -f package.json
          echo "All required files are present."

      - name: Workflow completed
        run: echo "Student Management System CI completed successfully!"